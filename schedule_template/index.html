<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GatherSpot — 聚會行程地點產生器</title>
  <!-- Leaflet CSS (Free OpenStreetMap Mode) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <!-- Modern UI Fonts: Inter + Noto Sans TC + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>

  <main class="app-shell" aria-label="聚會行程產生器主介面">
    <!-- 左側欄位：左上 日期時間選擇器 + 左下 行程資訊卡片與大 Copy 圖示 -->
    <section class="left-sidebar">
      <!-- 左上角：DateAndTime Picker -->
      <div class="glass-card picker-card" aria-labelledby="pickerTitle">
        <div class="card-header">
          <div class="card-title-group">
            <span class="title-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </span>
            <div>
              <h2 id="pickerTitle" class="card-title">日期與時間</h2>
              <p class="card-subtitle">點選日曆與時段即時帶入下方卡片</p>
            </div>
          </div>
          <button type="button" id="todayBtn" class="pill-btn" title="回到今天">今天</button>
        </div>

        <!-- 內嵌日曆選擇器 -->
        <div class="calendar-widget">
          <div class="calendar-nav">
            <button type="button" id="prevMonthBtn" class="icon-btn" aria-label="上個月">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span id="calendarMonthLabel" class="calendar-month-label">2026 年 10 月</span>
            <button type="button" id="nextMonthBtn" class="icon-btn" aria-label="下個月">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div id="calendarGrid" class="calendar-grid" role="grid" aria-label="日曆點選區"></div>
        </div>

        <!-- 時間選擇區（支援垂直滾動選取全天時段） -->
        <div class="time-picker-section">
          <div class="time-row">
            <span class="time-label">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              時間設定（可上下滾動選擇）
            </span>
            <input type="time" id="timeInput" class="time-input" value="18:30" aria-label="選擇時間" />
          </div>
          <div class="quick-times" id="quickTimeList" role="listbox" aria-label="上下垂直滾動選擇時間">
            <button type="button" class="time-chip" data-time="12:00">12:00</button>
            <button type="button" class="time-chip" data-time="14:30">14:30</button>
            <button type="button" class="time-chip active" data-time="18:30">18:30</button>
            <button type="button" class="time-chip" data-time="19:00">19:00</button>
            <button type="button" class="time-chip" data-time="20:00">20:00</button>
          </div>
        </div>
      </div>

      <!-- 左下角：行程摘要卡片 + 大型 Copy Icon 按鈕 -->
      <div class="glass-card summary-card" aria-labelledby="summaryTitle">
        <div class="card-header compact">
          <div class="card-title-group">
            <span class="title-icon accent-emerald" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </span>
            <div>
              <h2 id="summaryTitle" class="card-title">聚會資訊卡</h2>
              <p class="card-subtitle">點擊地圖自動帶入店名與連結，亦可手動微調</p>
            </div>
          </div>
        </div>

        <div class="summary-body">
          <div class="info-fields">
            <div class="field-item">
              <label for="storeNameInput" class="field-label">店名</label>
              <input
                type="text"
                id="storeNameInput"
                class="field-input"
                placeholder="點擊地圖店家或座標自動帶入..."
                autocomplete="off"
              />
            </div>

            <div class="field-item">
              <label for="locationUrlInput" class="field-label">地點</label>
              <div class="url-field-wrapper">
                <input
                  type="url"
                  id="locationUrlInput"
                  class="field-input mono-url"
                  placeholder="https://www.google.com/maps/..."
                  autocomplete="off"
                />
                <a
                  id="openMapLink"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="open-url-btn hidden"
                  title="在新分頁開啟 Google Maps"
                  aria-label="在新分頁開啟 Google Maps"
                >
                  <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                  </svg>
                </a>
              </div>
            </div>

            <div class="field-row-split">
              <div class="field-item">
                <label for="dateOutputInput" class="field-label">日期</label>
                <input
                  type="text"
                  id="dateOutputInput"
                  class="field-input"
                  placeholder="2026/10/16 (五)"
                  autocomplete="off"
                />
              </div>

              <div class="field-item">
                <label for="timeOutputInput" class="field-label">時間</label>
                <input
                  type="text"
                  id="timeOutputInput"
                  class="field-input"
                  placeholder="18:30"
                  autocomplete="off"
                />
              </div>
            </div>
          </div>

          <!-- 右下角大型 Copy 圖示按鈕 -->
          <div class="copy-action-dock">
            <button
              type="button"
              id="copyBtn"
              class="big-copy-btn"
              aria-label="複製店名、地點、日期與時間"
              title="一鍵複製行程資訊"
            >
              <!-- 大型 Copy Icon -->
              <svg class="copy-icon" viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2.5" ry="2.5"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <!-- 複製成功 Check Icon -->
              <svg class="check-icon hidden" viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span class="copy-btn-caption">COPY</span>
            </button>
            <span id="copyStatusToast" class="copy-toast" role="status" aria-live="polite">已複製！</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 右側欄位：互動式地圖面板 -->
    <section class="right-map-stage glass-card" aria-label="互動式地圖選點區">
      <!-- 地圖頂部搜尋與模式列 -->
      <div class="map-topbar">
        <form id="mapSearchForm" class="search-bar" role="search">
          <svg class="search-bar-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            id="mapSearchInput"
            class="search-input"
            placeholder="輸入餐廳、店名、地標或地址（按 Enter 搜尋）..."
            autocomplete="off"
          />
          <button type="submit" id="mapSearchBtn" class="search-submit-btn">搜尋</button>
        </form>

        <div class="map-actions">
          <button
            type="button"
            id="quotaBadgeBtn"
            class="quota-pill mode-free hidden"
            title="點擊切換地圖引擎或設定 Google Maps API Key"
          >
            <span class="status-dot"></span>
            <span id="quotaBadge">免費省流地圖 (0 額度)</span>
          </button>

          <button
            type="button"
            id="locateMeBtn"
            class="toolbar-btn"
            title="定位我的位置"
            aria-label="定位我的位置"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
          </button>

          <button
            type="button"
            id="mapSettingsBtn"
            class="toolbar-btn hidden"
            title="地圖引擎與 Google API 省流設定"
            aria-label="開啟地圖模式與省流設定"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- 搜尋結果下拉清單 -->
      <ul id="searchResultsList" class="search-results-list hidden" role="listbox" aria-label="搜尋結果清單"></ul>

      <!-- 地圖畫布區 -->
      <div class="map-viewport">
        <div id="osmMapContainer" class="map-canvas" aria-label="互動地圖"></div>
        <div id="googleMapContainer" class="map-canvas hidden" aria-label="Google Map 互動地圖"></div>
      </div>
    </section>
  </main>

  <!-- Google Maps 省流設定與 API Key 對話框 -->
  <dialog id="settingsDialog" closedby="any" class="settings-dialog" aria-labelledby="settingsDialogTitle">
    <form method="dialog" id="settingsForm" class="settings-form">
      <div class="dialog-header">
        <div>
          <h3 id="settingsDialogTitle">地圖引擎與 Google API 省流設定</h3>
          <p class="dialog-subtitle">選擇適合您的地圖載入方式，保護免費額度不被快速消耗</p>
        </div>
        <button type="button" id="closeDialogBtn" class="icon-btn" aria-label="關閉設定視窗">✕</button>
      </div>

      <div class="dialog-body">
        <div class="mode-selector">
          <label class="mode-option">
            <input type="radio" name="mapMode" value="osm" checked />
            <div class="mode-option-content">
              <div class="mode-title-row">
                <strong>🌿 免費智慧模式（OSM + 多重 POI 店名辨識）</strong>
                <span class="badge-tag recommended">推薦預設</span>
              </div>
              <p>100% 免費、免 API Key。點擊地圖自動檢索周邊店家名稱或路名門牌，並合成標準 Google Maps URL。</p>
            </div>
          </label>

          <label class="mode-option">
            <input type="radio" name="mapMode" value="google" />
            <div class="mode-option-content">
              <div class="mode-title-row">
                <strong>🗺️ 原生 Google Maps 省流模式</strong>
                <span class="badge-tag">自備 API Key</span>
              </div>
              <p>載入官方深色 Google 地圖。點擊店家圖示自動擷取真實店名與官方短連結（若未開通 Places API 亦會自動透過免費地理編碼補齊真實店名，絕不顯示冷冰冰的座標代碼）。</p>
            </div>
          </label>
        </div>

        <div id="googleKeyFieldGroup" class="key-field-group">
          <label for="googleApiKeyInput">Google Maps JavaScript API Key</label>
          <input
            type="password"
            id="googleApiKeyInput"
            class="key-input"
            placeholder="貼上您的 AIzaSy... 金鑰"
            autocomplete="off"
          />
          <small class="security-hint">
            🔒 金鑰僅儲存於您的瀏覽器本機 (`localStorage`)。系統已鎖定最小 Field Mask (`name`, `url`) 與本地快取以節省額度。
          </small>
        </div>

        <div class="cache-stats-row">
          <span id="cacheStatsText">已快取地點數：0 筆（重複點擊 0 消耗）</span>
          <button type="button" id="clearCacheBtn" class="pill-btn">清除快取</button>
        </div>
      </div>

      <div class="dialog-footer">
        <button type="button" id="cancelSettingsBtn" class="btn-secondary">取消</button>
        <button type="submit" id="saveSettingsBtn" class="btn-primary">儲存並套用</button>
      </div>
    </form>
  </dialog>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
